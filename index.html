<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonttu</title>
<meta name="description" content="Tonttu: Wi-Fi mouse and keyboard for your Windows PC, from your phone or tablet.">
<style>
  :root { color-scheme: dark; --bg: #0A0B0D; --txt: #EDEEF0; --sub: #8B9099; --lime: #C8F135; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #EFEFEB; --txt: #15161A; --sub: #5E636B; --lime: #5F7414; } }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px; padding: 48px 24px; max-width: 560px; margin: 0 auto; box-sizing: border-box; }
  h1 { font-size: 40px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--lime); }
  p { margin: 0; color: var(--sub); }
  .tag { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--sub); color: var(--sub); }
</style>
</head>
<body>
<main>
  <span class="tag">Beta coming soon</span>
  <h1><span>Tonttu</span></h1>
  <p>Wi-Fi mouse and keyboard for your Windows PC, from your phone or tablet. Nothing to install on the phone: scan a code and the remote opens in its browser.</p>
  <p>Free, no account, no ads. Everything stays on your home network.</p>
</main>
</body>
</html>
